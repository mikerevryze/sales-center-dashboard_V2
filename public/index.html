<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revryze Sales Center</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-box">
      <span class="spinner spinner-lg"></span>
      <p id="loading-msg">Loading dashboard…</p>
    </div>
  </div>

  <div id="error-banner" class="error-banner hidden"></div>

  <header class="header">
    <div class="header-brand">
      <span class="logo">REVRYZE</span>
      <span class="logo-sub">Sales Center</span>
    </div>
    <div class="header-filters">
      <select id="client-select" class="ctrl-select">
        <option value="all">All clients</option>
      </select>
      <select id="location-select" class="ctrl-select">
        <option value="all">All locations</option>
      </select>
      <select id="date-select" class="ctrl-select">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <button id="refresh-btn" class="btn btn-outline">&#8635; Refresh</button>
    </div>
  </header>

  <section class="metrics-bar">
    <div class="metric-card">
      <div class="metric-value" id="m-sold">—</div>
      <div class="metric-label">Memberships Sold</div>
    </div>
    <div class="metric-card">
      <div class="metric-value" id="m-revenue">—</div>
      <div class="metric-label">Revenue Closed</div>
    </div>
    <div class="metric-card">
      <div class="metric-value" id="m-appts">—</div>
      <div class="metric-label">Appointments Set</div>
    </div>
    <div class="metric-card">
      <div class="metric-value" id="m-calls">—</div>
      <div class="metric-label">Total Calls</div>
    </div>
    <div class="metric-card">
      <div class="metric-value" id="m-rate">—</div>
      <div class="metric-label">Close Rate</div>
    </div>
  </section>

  <main class="main-grid">

    <div class="left-col">

      <section class="panel" id="rep-lb-panel">
        <div class="panel-header">
          <h2 class="panel-title">Rep Leaderboard</h2>
          <select id="rep-sort" class="ctrl-select ctrl-select-sm">
            <option value="sold">Memberships Sold</option>
            <option value="revenue">Revenue</option>
            <option value="appointments">Appointments</option>
            <option value="calls">Call Volume</option>
          </select>
        </div>
        <div id="rep-lb-list" class="lb-list"></div>
      </section>

      <section class="panel" id="client-lb-panel">
        <div class="panel-header">
          <h2 class="panel-title">Client Leaderboard</h2>
          <select id="client-sort" class="ctrl-select ctrl-select-sm">
            <option value="sold">Memberships Sold</option>
            <option value="revenue">Revenue</option>
            <option value="closeRate">Close Rate</option>
          </select>
        </div>
        <div id="client-lb-list" class="lb-list"></div>
      </section>

    </div>

    <div class="right-col">

      <section class="panel" id="call-log-panel">
        <div class="panel-header">
          <h2 class="panel-title" id="call-log-title">All Calls</h2>
          <div class="filter-tabs" id="dir-tabs">
            <button class="tab active" data-dir="all">All</button>
            <button class="tab" data-dir="outbound">Outbound</button>
            <button class="tab" data-dir="inbound">Inbound</button>
            <button class="tab" data-dir="missed">Missed</button>
          </div>
        </div>
        <div id="call-log-list" class="call-list"></div>
      </section>

      <section class="panel hidden" id="call-detail-panel">
        <div class="panel-header">
          <h2 class="panel-title">Call Detail</h2>
          <button class="btn-icon" id="close-detail-btn">&#x2715;</button>
        </div>
        <div class="call-meta" id="call-meta"></div>
        <div class="audio-player">
          <button class="btn-play" id="play-btn">&#9654;</button>
          <div class="progress-wrap" id="progress-wrap">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span class="time-label" id="time-label">0:00 / 0:00</span>
          <audio id="audio-el"></audio>
        </div>
        <div class="transcript-box">
          <div class="transcript-label">Transcript</div>
          <div class="transcript-text" id="transcript-text">No transcript available</div>
        </div>
      </section>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
